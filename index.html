<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>💖 For Sayma 💖</title>
  <style>
    body {
      background: black;
      color: white;
      font-family: 'Arial', sans-serif;
      text-align: center;
      padding: 50px;
      overflow: hidden;
      position: relative;
    }
    canvas {
      display: block;
      margin: 0 auto;
    }
    #message {
      margin-top: 20px;
      font-size: 22px;
      font-weight: bold;
      color: pink;
    }
    .btn {
      margin: 15px;
      padding: 12px 25px;
      border: none;
      border-radius: 20px;
      background: pink;
      color: black;
      font-size: 18px;
      cursor: pointer;
      transition: 0.3s;
      position: relative;
      z-index: 2;
    }
    .btn:hover {
      background: hotpink;
      color: white;
    }
    .heart {
      position: absolute;
      font-size: 24px;
      color: red;
      animation: floatUp 3s linear forwards;
      pointer-events: none;
    }
    @keyframes floatUp {
      0% { transform: translateY(0) scale(1); opacity: 1; }
      100% { transform: translateY(-500px) scale(1.5); opacity: 0; }
    }
  </style>
</head>
<body>
  <h1>💌 Sayma, it’s for you 💌</h1>
  <canvas id="heartCanvas" width="400" height="350"></canvas>
  <div id="message">Will you be mine, my love? 💖</div>
  
  <button class="btn" onclick="showLove()">Yes</button>
  <button class="btn" onclick="showLove()">Definitely Yes</button>

  <script>
    // Draw heart on canvas
    function drawHeart() {
      const canvas = document.getElementById("heartCanvas");
      const ctx = canvas.getContext("2d");
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      ctx.beginPath();
      ctx.moveTo(200, 170);
      ctx.bezierCurveTo(200, 100, 100, 100, 100, 170);
      ctx.bezierCurveTo(100, 230, 200, 280, 200, 330);
      ctx.bezierCurveTo(200, 280, 300, 230, 300, 170);
      ctx.bezierCurveTo(300, 100, 200, 100, 200, 170);

      ctx.fillStyle = "red";
      ctx.fill();
      ctx.strokeStyle = "pink";
      ctx.stroke();
    }

    // Create floating heart
    function createFloatingHeart() {
      const heart = document.createElement("div");
      heart.classList.add("heart");
      heart.innerText = "❤️";
      heart.style.left = Math.random() * window.innerWidth + "px";
      heart.style.fontSize = (20 + Math.random() * 20) + "px";
      document.body.appendChild(heart);
      setTimeout(() => heart.remove(), 3000);
    }

    // Show multiple floating hearts
    function showHearts() {
      for(let i = 0; i < 30; i++){
        setTimeout(createFloatingHeart, i * 100);
      }
    }

    // Show love message after clicking
    function showLove() {
      document.getElementById("message").innerText = "I will keep loving you ❤️";
      showHearts();
    }

    // Initialize
    drawHeart();
  </script>
</body>
</html>
